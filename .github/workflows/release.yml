name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.targets }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - id: matrix
        name: Enumerate Zig Tier 1-3 targets
        run: echo "targets=$(python3 scripts/release.py matrix)" >> "$GITHUB_OUTPUT"

  native:
    name: Release checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: build/hc
          - os: macos-latest
            binary: build/hc
          - os: windows-latest
            binary: build/hc.exe
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Zig
        if: runner.os == 'Windows'
        shell: pwsh
        run: python scripts/release.py setup-zig --out "$env:RUNNER_TEMP\hc-zig" >> $env:GITHUB_PATH
      - name: Install pinned Zig
        if: runner.os != 'Windows'
        shell: bash
        run: python3 scripts/release.py setup-zig --out "$RUNNER_TEMP/hc-zig" >> "$GITHUB_PATH"
      - name: Check Zig version
        run: zig version
      - name: Check release scripts and target manifest
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m py_compile scripts/release.py
          python scripts/release.py matrix | Out-Null
          python scripts/test_release.py
      - name: Check release scripts and target manifest
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python3 -m py_compile scripts/release.py
          python3 scripts/release.py matrix > /dev/null
          python3 scripts/test_release.py
      - name: Check formatting and syntax
        run: zig fmt --check hc.zig
      - name: Check AST
        run: zig ast-check hc.zig
      - name: Run Zig tests
        run: zig test hc.zig
      - name: Build native CLI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          zig build-exe hc.zig -O ReleaseSafe "-femit-bin=${{ matrix.binary }}"
      - name: Build native CLI
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p build
          zig build-exe hc.zig -O ReleaseSafe -femit-bin=${{ matrix.binary }}
      - name: Smoke-test native CLI
        if: runner.os == 'Windows'
        shell: pwsh
        run: python scripts/release.py smoke --binary "${{ matrix.binary }}"
      - name: Smoke-test native CLI
        if: runner.os != 'Windows'
        shell: bash
        run: python3 scripts/release.py smoke --binary "${{ matrix.binary }}"

  build:
    name: Build ${{ matrix.target }}
    needs: targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Attempt target build and record diagnostics
        run: python3 scripts/release.py build "${{ matrix.target }}" --out target-output
        continue-on-error: true
      - name: Upload target report and binary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: target-${{ matrix.target }}
          path: target-output/${{ matrix.target }}
          if-no-files-found: error

  publish:
    name: Validate and publish release assets
    needs: [targets, native, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: target-reports
          pattern: target-*
          merge-multiple: false
      - name: Validate reports and assemble deterministic release assets
        run: python3 scripts/release.py collect "${GITHUB_REF_NAME}" "${GITHUB_REPOSITORY}" --out release-assets
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" release-assets/* --verify-tag --generate-notes --title "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}"
